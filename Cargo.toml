[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Error handling
thiserror = "2.0.21"
# Rust utilities
generativity = "1.2.1"
derive_more = "2.1.1"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 0 }
undocumented_unsafe_blocks = { level = "deny", priority = 0 }
missing_docs_in_private_items = { level = "warn", priority = 0 }
redundant_pub_crate = { level = "allow", priority = 1 }
redundant_clone = { level = "warn", priority = 1 }
expl_impl_clone_on_copy = { level = "warn", priority = 1 }

[workspace.lints.rust]
missing_docs = { level = "warn", priority = 1 }
nonstandard_style = { level = "deny", priority = 0 }
future_incompatible = { level = "deny", priority = 0 }
deprecated_safe_2024 = { level = "deny", priority = 0 }
missing_debug_implementations = { level = "warn", priority = 1 }
missing_copy_implementations = { level = "warn", priority = 1 }

[profile.dev]
debug = 1
# Subsecond hot-patch on Windows can overflow the main stack at opt-level 0
# (dioxuslabs/dioxus#5311).
# Keep workspace crates at 1!
opt-level = 1
lto = "off"

[profile.dev.package."*"]
opt-level = 1
